global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: hrflow-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: hrflow-auth
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]

  - job_name: hrflow-paie
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3002"]

  - job_name: hrflow-conges
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3003"]

  - job_name: hrflow-recrutement
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3004"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
