global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - hrflow-alertmanager.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:9093

scrape_configs:
  - job_name: hrflow-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - hrftlow-api.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:3000

  - job_name: hrflow-auth
    metrics_path: /metrics
    static_configs:
      - targets:
          - hrflow-auth.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:3001

  - job_name: hrflow-paie
    metrics_path: /metrics
    static_configs:
      - targets:
          - hrflow-paie.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:3002

  - job_name: hrflow-conges
    metrics_path: /metrics
    static_configs:
      - targets:
          - hrflow-conges.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:3003

  - job_name: hrflow-recrutement
    metrics_path: /metrics
    static_configs:
      - targets:
          - hrflow-recrutement.internal.salmonsand-7377abaa.francecentral.azurecontainerapps.io:3004
