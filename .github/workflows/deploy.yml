# Pipeline CI/CD - build, tests, security et staging Azure.

name: CI - Build, Test, Security and Azure Staging

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-hrflow
  AZURE_LOCATION: francecentral
  ACR_NAME: <your-acr-name>
  STAGING_FRONTEND_APP: hrflow-frontend-staging
  STAGING_GATEWAY_APP: hrflow-api-gateway-staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - name: Build service images
        run: |
          docker build -t hrflow-api-gateway -f services/api-gateway/Dockerfile services/api-gateway
          docker build -t hrflow-auth -f services/auth/Dockerfile services/auth
          docker build -t hrflow-conges -f services/conges/Dockerfile services/conges
          docker build -t hrflow-paie -f services/paie/Dockerfile services/paie
          docker build -t hrflow-recrutement -f services/recrutement/Dockerfile services/recrutement
          docker build -t hrflow-frontend -f frontend/Dockerfile frontend

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Backend tests and coverage
        run: npm run test:coverage
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --legacy-peer-deps
      - name: Build frontend for E2E
        run: npm --prefix frontend run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/

  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
      - name: Start API for OWASP ZAP
        run: |
          docker network create zap-net
          docker build -t hrflow-api-gateway-security -f services/api-gateway/Dockerfile services/api-gateway
          docker run -d --name hrflow-api --network zap-net -p 3000:3000 \
            -e DB_HOST=127.0.0.1 -e DB_NAME=hrflow -e DB_USER=hrflow \
            -e DB_PASSWORD=test -e JWT_SECRET=test-secret hrflow-api-gateway-security
          for attempt in $(seq 1 15); do
            docker exec hrflow-api node -e "require('http').get('http://127.0.0.1:3000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" && exit 0
            sleep 2
          done
          docker logs hrflow-api
          exit 1
      - name: OWASP ZAP baseline scan
        run: |
          docker run --network zap-net --user root -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://hrflow-api:3000/health -r zap-report.html -I
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: zap-report.html
          if-no-files-found: error

  deploy-staging:
    name: Deploy to Azure Staging
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}
      - name: Build and push gateway image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/hrflow-api-gateway:staging -f services/api-gateway/Dockerfile services/api-gateway
          docker push ${{ env.ACR_NAME }}.azurecr.io/hrflow-api-gateway:staging
      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/hrflow-frontend:staging -f frontend/Dockerfile frontend
          docker push ${{ env.ACR_NAME }}.azurecr.io/hrflow-frontend:staging
      - name: Deploy API gateway to Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.STAGING_GATEWAY_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hrflow-api-gateway:staging \
            --target-port 3000 \
            --ingress external \
            --environment hrflow-staging-env
      - name: Deploy frontend to Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.STAGING_FRONTEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hrflow-frontend:staging \
            --target-port 80 \
            --ingress external \
            --environment hrflow-staging-env
