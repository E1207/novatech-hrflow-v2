# Pipeline Jour 2 - build, tests et securite.

name: CI - Build, Test and Security

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - name: Build service images
        run: |
          docker build -t hrflow-api-gateway -f services/api-gateway/Dockerfile services/api-gateway
          docker build -t hrflow-auth -f services/auth/Dockerfile services/auth
          docker build -t hrflow-conges -f services/conges/Dockerfile services/conges
          docker build -t hrflow-paie -f services/paie/Dockerfile services/paie
          docker build -t hrflow-recrutement -f services/recrutement/Dockerfile services/recrutement
          docker build -t hrflow-frontend -f frontend/Dockerfile frontend

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Backend tests and coverage
        run: npm run test:coverage
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --legacy-peer-deps
      - name: Build frontend for E2E
        run: npm --prefix frontend run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/

  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
      - name: Start API for OWASP ZAP
        run: |
          docker network create zap-net
          docker build -t hrflow-api-gateway-security -f services/api-gateway/Dockerfile services/api-gateway
          docker run -d --name hrflow-api --network zap-net -p 3000:3000 \
            -e DB_HOST=127.0.0.1 -e DB_NAME=hrflow -e DB_USER=hrflow \
            -e DB_PASSWORD=test -e JWT_SECRET=test-secret hrflow-api-gateway-security
          for attempt in $(seq 1 15); do
            docker exec hrflow-api node -e "require('http').get('http://127.0.0.1:3000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" && exit 0
            sleep 2
          done
          docker logs hrflow-api
          exit 1
      - name: OWASP ZAP baseline scan
        run: |
          docker run --network zap-net --user root -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://hrflow-api:3000/health -r zap-report.html -I
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: zap-report.html
          if-no-files-found: error

  staging:
    name: Staging (build & push images)
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push staging images (tagged with commit SHA)
        run: |
          set -e
          declare -A targets=(
            [frontend]=frontend
            [api-gateway]=services/api-gateway
            [auth]=services/auth
            [paie]=services/paie
            [conges]=services/conges
            [recrutement]=services/recrutement
          )
          for name in "${!targets[@]}"; do
            ctx="${targets[$name]}"
            docker buildx build --platform linux/amd64 --target staging \
              -t "$ACR_LOGIN_SERVER/hrflow-$name:$IMAGE_TAG" \
              -t "$ACR_LOGIN_SERVER/hrflow-$name:staging" \
              -f "$ctx/Dockerfile" "$ctx" --push
          done
      - name: Upload image tag artifact
        run: echo "$IMAGE_TAG" > image-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt

  production:
    name: Production (Blue/Green deploy + smoke tests + auto-rollback)
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Blue/Green deploy each service
        run: bash scripts/deploy/blue-green-deploy.sh
      - name: Post-cutover smoke tests
        id: smoke
        run: bash scripts/deploy/smoke-test.sh
      - name: Automatic rollback on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: bash scripts/deploy/rollback.sh auto
